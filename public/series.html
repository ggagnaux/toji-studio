<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Series &mdash; Toji Studios</title>
  <link rel="stylesheet" href="assets/css/site.css" />
  <link rel="stylesheet" href="assets/css/series.css" />
  <link rel="stylesheet" href="assets/css/series-cards.css" />
</head>
<body class="home-animated">
  <header id="siteHeader"></header>

  <main class="container page-with-sticky-hero">
    <section class="page-toolbar page-toolbar--public" aria-label="Series tools">
      <div class="page-toolbar__shell">
        <div class="page-toolbar__left">
          <a id="allSeriesLink" class="page-toolbar__pill is-active" href="series.html" aria-current="page">All Series</a>
          <a class="page-toolbar__pill" href="gallery.html">Gallery</a>
          <a class="page-toolbar__pill" href="contact.html">Contact</a>
        </div>
        <div class="page-toolbar__right">
          <div class="segmented page-toolbar__theme" role="group" aria-label="Theme mode">
            <button type="button" data-theme-choice="system">System</button>
            <button type="button" data-theme-choice="light">Light</button>
            <button type="button" data-theme-choice="dark">Dark</button>
          </div>
        </div>
      </div>
    </section>
    <section class="hero hero--sticky series-hero" style="padding-bottom:10px">
      <h1>Series</h1>
      <p class="series-hero__intro">
        <span id="seriesOverviewIntro">Browse curated collection of images.</span>
        <span id="seriesDetailIntro" hidden>
          Browse curated collections of images.<br/><br/>Click
          <button class="series-hero__jump" type="button" data-series-scroll-target="seriesHighlights" disabled>Highlights</button>
          to view featured images.<br/>Click
          <button class="series-hero__jump" type="button" data-series-scroll-target="seriesAllPieces" disabled>All pieces</button>
          to view all images in this series.
        </span>
      </p>
    </section>

    <section id="seriesCardsSection" class="series-cards-section page-toolbar-target" aria-labelledby="seriesCardsHeading">
      <div class="section-title">
        <h2 id="seriesCardsHeading">Series</h2>
        <span id="seriesCount">&mdash;</span>
      </div>
      <div id="seriesCardsGrid" class="series-showcase-grid" aria-label="Series collection"></div>
    </section>

    <section id="seriesDetailPanel" class="series-detail-panel page-toolbar-target" hidden>
      <div id="detail"></div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script type="module" src="./assets/js/series-page.js"></script>
</body>
</html>
